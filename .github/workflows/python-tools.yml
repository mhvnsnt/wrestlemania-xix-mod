name: Python tool tests

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tools.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only tool tests
        run: python -m unittest discover -s tests -v
